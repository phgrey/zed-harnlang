name: Release Proxy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --workspace --all-targets

  build-and-release:
    name: Build & Release Proxy
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Proxy
        run: cargo build --release -p harn-lsp-proxy --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package Binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf harn-lsp-proxy-${{ matrix.target }}.tar.gz harn-lsp-proxy
          mv harn-lsp-proxy-${{ matrix.target }}.tar.gz ../../../

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: harn-lsp-proxy-${{ matrix.target }}.tar.gz
          generate_release_notes: true
