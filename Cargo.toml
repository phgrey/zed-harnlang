[package]
name = "zed-harnlang"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Harn language server extension for Zed."
repository = "https://github.com/phgrey/zed-harnlang"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
zed_extension_api = "0.3.0"

[workspace]
members = ["crates/harn-lsp-proxy", "crates/lsp-proxy"]
resolver = "2"
